services:
  - type: web
    name: adverse-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONITORING_CRON_SECRET
        sync: false
      - key: CYBER_MONITORING_CRON_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: adenix271@gmail.com
      - key: BREVO_FROM_NAME
        value: ADVERSE
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false

  - type: cron
    name: adverse-cyber-monitoring
    runtime: node
    rootDir: apps/api
    schedule: "*/15 * * * *"
    buildCommand: npm install
    startCommand: node scripts/cyber-monitoring-cron.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        sync: false
      - key: CYBER_MONITORING_CRON_SECRET
        sync: false
