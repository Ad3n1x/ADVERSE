services:
  - type: web
    name: adverse-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONITORING_CRON_SECRET
        sync: false
  - type: cron
    name: adverse-monitoring-scheduler
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: cd apps/api && npm install
    startCommand: cd apps/api && node scripts/monitoring-cron.js
    envVars:
      - key: API_URL
        value: https://adverse-api-7yim.onrender.com
      - key: MONITORING_CRON_SECRET
        sync: false
