name: Build ADVERSE Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "apps/web/src/features/public-search/**"
      - ".github/workflows/build-adverse-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADVERSE-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare public download
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk /tmp/ADVERSE.apk

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ADVERSE Android Latest Build
          body: |
            Download the latest ADVERSE Android app build.
            This is a debug APK, not a Play Store release.
          prerelease: true
          make_latest: false
          files: /tmp/ADVERSE.apk
          overwrite_files: true
          fail_on_unmatched_files: true
