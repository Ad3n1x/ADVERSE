name: Build ADVERSE Android APK
# Native Compose build and public APK publishing.
# Build includes the native public link-check screen.

on:
  push:
    branches: [main, ui/smooth-fingerprint-polish, fix/android-standalone-experience, feat/native-android-search-experience, feat/native-app-feature-parity, feat/android-responsive-website-parity]
    paths:
      - "android-app/**"
      - "apps/web/src/features/public-search/**"
      - "apps/web/src/app/WorkspaceApp.tsx"
      - "apps/web/src/features/auth/AuthScreen.tsx"
      - "apps/web/src/search-engine-theme.css"
      - "apps/web/src/main.tsx"
      - ".github/workflows/build-adverse-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adverse-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify web app build
        run: |
          npm install
          npm run build -w @adverse/web
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADVERSE-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare public download
        if: github.ref == 'refs/heads/main'
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk /tmp/ADVERSE.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "/tmp/ADVERSE-${GITHUB_SHA}.apk"
      - name: Publish public APK download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ADVERSE Android Latest Build
          body: |
            Download the latest ADVERSE native Android app.
            This is a debug APK, not a Play Store release.
          prerelease: true
          make_latest: false
          files: |
            /tmp/ADVERSE.apk
            /tmp/ADVERSE-${{ github.sha }}.apk
          overwrite_files: true
          fail_on_unmatched_files: true
