name: ADVERSE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adverse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API syntax and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: npm install
      - name: Check API syntax
        run: npm run check -w @adverse/api
      - name: Run API tests
        run: npm test -w @adverse/api

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: npm install
      - name: Type-check frontend
        run: npm run typecheck -w @adverse/web
      - name: Build production frontend
        run: npm run build -w @adverse/web


  production-smoke:
    name: Live API health and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for live API health endpoint
        run: curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 https://adverse-api-7yim.onrender.com/api/v1/health
      - name: Verify API readiness
        run: |
          response="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --output /tmp/adverse-ready.json --write-out '%{http_code}' https://adverse-api-7yim.onrender.com/api/v1/ready)"
          cat /tmp/adverse-ready.json
          test "$response" = "200"

  browser-e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
