name: ADVERSE Automated Discovery

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/adverse-discovery.yml"

permissions:
  contents: read

concurrency:
  group: adverse-automated-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger bounded public-source discovery
        env:
          API_URL: https://adverse-api-7yim.onrender.com
          DISCOVERY_CRON_SECRET: ${{ secrets.DISCOVERY_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${API_URL}" || -z "${DISCOVERY_CRON_SECRET}" ]]; then
            echo "Configure DISCOVERY_CRON_SECRET in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Submitting bounded discovery to the configured production API."
          status="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "${API_URL%/}/api/v1/internal/discovery/run" \
            --header "x-discovery-secret: ${DISCOVERY_CRON_SECRET}" \
            --header "accept: application/json" \
            --output /tmp/adverse-discovery.json \
            --write-out "%{http_code}")"
          cat /tmp/adverse-discovery.json
          test "$status" = "202" || { echo "::error::Discovery scheduler did not return HTTP 202 (received $status)."; exit 1; }
          node --input-type=module -e 'import fs from "node:fs"; const body=JSON.parse(fs.readFileSync("/tmp/adverse-discovery.json","utf8")); if (body.job?.status !== "accepted" || typeof body.job.id !== "string" || !body.job.id) { console.error("Discovery acknowledgement contract failed"); process.exit(1); } console.log("Discovery job accepted:", body.job.id);'
